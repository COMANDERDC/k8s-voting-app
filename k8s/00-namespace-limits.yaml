apiVersion: v1
kind: Namespace
metadata:
  name: voting-system
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: voting-quota
  namespace: voting-system
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: voting-limit-range
  namespace: voting-system
spec:
  limits:
  - default:
      cpu: "300m"
      memory: "256Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container